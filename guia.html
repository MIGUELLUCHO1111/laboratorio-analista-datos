<title>Laboratorio del Analista de Datos</title>
<meta name="description" content="Plataforma interactiva para aprender Web Scraping, APIs, Python, SQL, Excel y Power BI practicando.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: cuaderno de laboratorio — barra lateral fija con la ruta de estudio; área de trabajo amplia con lecciones, laboratorio y retos por módulo */
:root{
  --bg:#F4F6F4; --panel:#FFFFFF; --panel-2:#E8EEEB; --ink:#14201C; --muted:#55645E; --line:#D3DDD8;
  --accent:#0F6E38; --on-accent:#FFFFFF;
  --ok:#1C7A4B; --bad:#B3261E; --warn:#9A6200;
  --ok-bg:#E1F2E8; --bad-bg:#FBE6E3; --warn-bg:#FAEFD7;
  --c-fund:#0F6E38; --c-scr:#C8102E; --c-api:#0040E6; --c-py:#F2C200; --c-sql:#0A6CFF; --c-xl:#14803F; --c-bi:#F2C200; --c-proj:#C8102E; --c-git:#B00D28; --c-tool:#0F6E38;
  --c-yel-t:#7A5C00; --on-yel:#1A1600;
  --on-m:#FFFFFF;
  --code-bg:#13201C; --code-ink:#DCE8E3; --code-muted:#7E948C; --code-key:#7FD4B8; --code-str:#F0C674;
  --hl:#FFE36B;
  --hero-bg:#0A1A12; --hero-ink:#F2F7F3; --hero-green:#3FCB72; --yel:#FFD21F; --red:#E3122F; --blue:#1E5BFF; --green:#11A64B;
  --f-display:'Archivo','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --panel:#141C19; --panel-2:#1B2521; --ink:#E3ECE8; --muted:#95A69F; --line:#27342F;
    --accent:#3FCB72; --on-accent:#05120E;
    --ok:#4FC786; --bad:#F28479; --warn:#E3B04A;
    --ok-bg:#11301F; --bad-bg:#3A1613; --warn-bg:#352610;
    --c-fund:#3FCB72; --c-scr:#FF4D5E; --c-api:#5B8CFF; --c-py:#FFD21F; --c-sql:#3FA2FF; --c-xl:#46C978; --c-bi:#FFD21F; --c-proj:#FF4D5E; --c-git:#FF6B7A; --c-tool:#3FCB72;
    --c-yel-t:#FFD21F;
    --on-m:#06100D;
    --code-bg:#09100E; --hl:#6B5A12; --hero-bg:#06100B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --panel:#141C19; --panel-2:#1B2521; --ink:#E3ECE8; --muted:#95A69F; --line:#27342F;
  --accent:#3FCB72; --on-accent:#05120E;
  --ok:#4FC786; --bad:#F28479; --warn:#E3B04A;
  --ok-bg:#11301F; --bad-bg:#3A1613; --warn-bg:#352610;
  --c-fund:#3FCB72; --c-scr:#FF4D5E; --c-api:#5B8CFF; --c-py:#FFD21F; --c-sql:#3FA2FF; --c-xl:#46C978; --c-bi:#FFD21F; --c-proj:#FF4D5E; --c-git:#FF6B7A; --c-tool:#3FCB72;
    --c-yel-t:#FFD21F;
  --on-m:#06100D;
  --code-bg:#09100E; --hl:#6B5A12; --hero-bg:#06100B;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* módulos con amarillo fuerte: texto oscuro sobre el amarillo y un tono legible para letras */
[style*="--c-py"],[style*="--c-bi"]{--on-m:var(--on-yel);--m-t:var(--c-yel-t)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
code,kbd,pre,textarea.code{font-family:var(--f-mono)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px}
.xpbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;background:var(--panel-2)}
.xpbox .lvl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.xpbox .lvl b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}
.nav{display:grid;gap:2px}
.nav-group{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px;font-weight:700}
.nav button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:7px 8px;border-radius:8px;font-size:15px}
.nav button:hover{background:var(--panel-2)}
.nav button.active{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--m)}
.glyph{width:30px;height:30px;border-radius:7px;background:var(--m);color:var(--on-m);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:-.02em}
.ring{width:22px;height:22px}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--m);stroke-linecap:round;transition:stroke-dasharray .5s}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:13px;color:var(--muted);padding:0 6px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px;text-align:left}
.topbar{display:none}
main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 80px;min-width:0}
.section{max-width:1120px;margin:0 auto;display:grid;gap:26px}
.section[hidden]{display:none!important}
.section>*,.pane>*,.lessons>*,.chals>*,.card>*,.grid2>*,.grid3>*,.split>*,.lesson-body>*,.chal>*{min-width:0}

@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .25s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar b{font-family:var(--f-display)}
  .topbar .xp-mini{margin-left:auto;font-size:13px;color:var(--muted)}
  main{padding-block:20px 60px}
}

/* ---------- cabecera de módulo ---------- */
.mhead{display:grid;gap:12px;background:var(--m);color:var(--on-m);border-radius:18px;padding:clamp(20px,4vw,34px);position:relative;overflow:hidden;isolation:isolate}
.mhead::after{content:attr(data-glyph);position:absolute;right:-10px;bottom:-34px;font-family:var(--f-mono);font-weight:600;font-size:clamp(120px,20vw,210px);line-height:1;opacity:.13;z-index:-1;letter-spacing:-.06em;pointer-events:none}
.mhead .eyebrow{color:var(--on-m)!important;opacity:.9}
.mhead .eyebrow .glyph{background:var(--on-m);color:var(--m)}
.mhead .lead{color:var(--on-m)!important;opacity:.9}
.mhead .lead code{background:color-mix(in srgb,var(--on-m) 16%,transparent);border-color:transparent;color:inherit}
.mhead .chip{background:color-mix(in srgb,var(--on-m) 14%,transparent);border-color:transparent;color:var(--on-m)}
.mhead .chip b{color:var(--on-m)}
.mhead .mring{position:absolute;right:clamp(16px,3vw,30px);top:clamp(16px,3vw,28px);width:64px;height:64px}
.mhead .mring circle{fill:none;stroke-width:6}
.mhead .mring .bg{stroke:color-mix(in srgb,var(--on-m) 22%,transparent)}
.mhead .mring .fg{stroke:var(--on-m);stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.mhead .mring text{fill:var(--on-m);font-family:var(--f-display);font-weight:700;font-size:15px}
.mhead h1{padding-right:76px}
.eyebrow{display:flex;gap:10px;align-items:center;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--m-t,var(--m))}
.mhead h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.025em}
.mhead .lead{font-size:18px;color:var(--muted);max-width:68ch}
.mstats{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--panel);color:var(--muted)}
.chip b{color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
@media (max-width:900px){.tabs{top:calc(env(safe-area-inset-top,0px) + 55px)}}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 15px;font-size:14.5px;font-weight:600}
.tabs button.on{background:var(--m);border-color:var(--m);color:var(--on-m)}
.pane{display:grid;gap:18px}
.pane[hidden]{display:none!important}
h2.st{font-size:24px;font-weight:700;letter-spacing:-.01em}
h3{font-size:19px;font-weight:700}
.sub{color:var(--muted);max-width:72ch}

/* ---------- tarjetas, botones ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--m,var(--accent));background:var(--m,var(--accent));color:var(--on-m);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14.5px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.kbd,kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel-2)}
code{font-size:.88em;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.note{border-left:3px solid var(--m,var(--accent));background:var(--panel-2);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
ul.clean{margin:0;padding-left:20px;display:grid;gap:4px}
.muted{color:var(--muted)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m-t,var(--m))}

/* ---------- lecciones ---------- */
.lessons{display:grid;gap:10px}
details.lesson{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.lesson summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:13px 16px}
details.lesson summary::-webkit-details-marker{display:none}
.lnum{width:34px;height:34px;border-radius:50%;border:2px solid var(--m);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--m-t,var(--m))}
details.lesson.done .lnum{background:var(--m);color:var(--on-m)}
details.lesson summary h3{font-size:17.5px}
details.lesson summary small{display:block;color:var(--muted);font-size:13.5px;font-family:var(--f-body);font-weight:400;margin-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
details[open] .chev{transform:rotate(90deg)}
.lesson-body{padding:4px 18px 18px 62px;display:grid;gap:14px;min-width:0}
@media (max-width:600px){.lesson-body{padding:4px 14px 16px}}
.lesson-body > p{max-width:72ch}

/* ---------- código y editor ---------- */
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;margin:0;overflow-x:auto;font-size:13.5px;line-height:1.6;tab-size:4}
pre.code .c{color:var(--code-muted)} pre.code .k{color:var(--code-key)} pre.code .s{color:var(--code-str)}
.editor{display:grid;border-radius:9px;overflow:hidden;border:1px solid var(--line);min-width:0}
.editor-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel-2);padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.editor-bar .sp{margin-left:auto}
textarea.code{width:100%;min-height:120px;resize:vertical;border:0;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;font-size:14px;line-height:1.6;tab-size:4;outline:none;white-space:pre;overflow-x:auto}
textarea.code:focus{box-shadow:inset 0 0 0 2px var(--m,var(--accent))}
.out{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;font-family:var(--f-mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word;min-height:44px;max-height:340px;overflow:auto}
.out.err{color:var(--bad);background:var(--bad-bg)}
.out .dim{color:var(--muted)}
input.inp,select.inp,textarea.inp{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input.inp.mono{font-family:var(--f-mono);font-size:14px}

/* ---------- tablas ---------- */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:420px;background:var(--panel)}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.n{text-align:right}
table.t tr:last-child td{border-bottom:0}
.tcap{font-size:13px;color:var(--muted)}

/* ---------- quiz ---------- */
.quiz{display:grid;gap:14px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.q-t{font-weight:600}
.opts{display:grid;gap:7px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--m)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--ink)}
.opt:disabled{cursor:default}
.why{font-size:14.5px;color:var(--muted)}

/* ---------- retos ---------- */
.chals{display:grid;gap:12px}
.chal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.chal-h{display:flex;gap:10px;align-items:center}
.chal-st{width:22px;height:22px;border-radius:50%;border:2px dashed var(--muted);flex:none;display:grid;place-items:center;font-size:12px}
.chal.is-done{border-color:var(--ok)}
.chal.is-done .chal-st{border:0;background:var(--ok);color:var(--panel)}
.chal.is-done .chal-st::after{content:"✓";font-weight:700}
.chal h4{font-size:16.5px}
.chal-hint{font-size:14.5px;background:var(--warn-bg);border-radius:8px;padding:8px 12px}
.chal-msg{font-size:14.5px;font-weight:600}
.chal-msg.ok{color:var(--ok)} .chal-msg.bad{color:var(--bad)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(calc(100% + 60px));visibility:hidden;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14.5px;transition:transform .3s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}

/* ---------- inicio ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:clamp(22px,4.5vw,44px);position:relative;overflow:hidden;isolation:isolate}
.hero-txt{display:grid;gap:16px;align-content:start;min-width:0}
.hero canvas{width:100%;height:100%;min-height:260px;display:block}
@media (max-width:1100px){.hero{grid-template-columns:minmax(0,1fr)}.hero canvas{min-height:150px;height:150px}}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.03em;max-width:15ch;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--yel)}
.hero .lead{color:color-mix(in srgb,var(--hero-ink) 82%,transparent)!important}
.hero .eyebrow{color:var(--hero-green)!important}
.hero .btn.ghost{color:var(--hero-ink);border-color:color-mix(in srgb,var(--hero-ink) 35%,transparent)}
.hero .btn.ghost:hover{background:color-mix(in srgb,var(--hero-ink) 12%,transparent)}
.hero .kpis{display:flex;flex-wrap:wrap;gap:22px;margin-top:6px}
.hero .kpis div{display:grid}
.hero .kpis b{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.hero .kpis span{font-size:13px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
@media (max-width:760px){.pipeline{grid-template-columns:minmax(0,1fr)}}
.pstage{padding:16px;border-right:1px solid var(--line);display:grid;gap:8px;align-content:start;position:relative}
.pstage:last-child{border-right:0}
@media (max-width:760px){.pstage{border-right:0;border-bottom:1px solid var(--line)}.pstage:last-child{border-bottom:0}}
.pstage .pn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pstage h3{font-size:17px}
.pstage p{font-size:14px;color:var(--muted)}
.pstage .row{gap:6px}
.mbtn{border:0;border-radius:7px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--m);color:var(--on-m)}
.modcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.modcard:hover{border-color:var(--m)}
.modcard .top{display:flex;gap:10px;align-items:center}
.modcard h3{font-size:17px}
.modcard p{font-size:14px;color:var(--muted)}
.modcard .bar i{background:var(--m)}
.modcard .pc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- utilidades varias de los laboratorios ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px}
.pill.s2{background:var(--ok-bg);color:var(--ok)} .pill.s4{background:var(--warn-bg);color:var(--warn)} .pill.s5{background:var(--bad-bg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .fstep{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 11px;font-size:14px}
.flow .arr{color:var(--muted)}
.big{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
svg text{font-family:var(--f-body)}

/* ---------- dinámica e interacción ---------- */
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.pane:not([hidden]){animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.section:not([hidden])>.mhead{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.btn{transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.96)}
.modcard,.chal,.q,details.lesson,.vis,.gz{transition:transform .18s,box-shadow .18s,border-color .18s}
.modcard:hover,.chal:hover,.vis:hover{transform:translateY(-3px);box-shadow:0 10px 26px color-mix(in srgb,var(--m,var(--accent)) 22%,transparent)}
details.lesson:hover{border-color:var(--m)}
details.lesson[open]{border-color:var(--m);box-shadow:inset 4px 0 0 var(--m)}
.modcard{position:relative;overflow:hidden}
.modcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--m);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .6s}
.chal.is-done{animation:pop .45s}
.chal.is-done .chal-st{animation:pop .45s}
.nav button{transition:background .15s,transform .15s}
.nav button:hover{transform:translateX(3px)}
.nav button.active{background:color-mix(in srgb,var(--m) 16%,transparent);font-weight:700}
.tabs button{transition:background .15s,color .15s,transform .12s}
.tabs button:hover:not(.on){border-color:var(--m);transform:translateY(-1px)}
.opt{transition:border-color .15s,background .15s,transform .12s}
.opt:hover:not(:disabled){transform:translateX(4px)}
.opt.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.lvlup{position:fixed;left:50%;top:22%;transform:translate(-50%,-20px);opacity:0;z-index:75;background:var(--hero-bg);color:var(--hero-ink);border-radius:18px;padding:22px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);transition:opacity .35s,transform .35s;pointer-events:none;max-width:calc(100vw - 32px);border:2px solid var(--yel)}
.lvlup.show{opacity:1;transform:translate(-50%,0)}
.lvlup small{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--yel);font-weight:700}
.lvlup b{font-family:var(--f-display);font-size:28px;font-weight:800}
.daybox{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}
.daybox .fire{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--red);line-height:1}
.daybox .bar i{background:var(--yel)}
@media (prefers-reduced-motion: reduce){.hero canvas{display:none}}


/* ---------- Tutor IA ---------- */
.tutor-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;border:0;border-radius:99px;background:var(--ink);color:var(--bg);padding:11px 18px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tf-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.tutor-fab.off .tf-dot{background:var(--muted);box-shadow:none}
.tutor{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:55;width:min(420px,calc(100vw - 32px));height:min(620px,calc(100% - 110px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
.tutor[hidden]{display:none!important}
@media (max-width:600px){.tutor{right:16px;left:16px;width:auto}}
.tutor-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tutor-h b{font-family:var(--f-display);font-size:17px;display:block}
.tutor-h small{color:var(--muted);font-size:12.5px}
.tutor-quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tutor-quick[hidden],.tutor-in[hidden]{display:none!important}
.tutor-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 12px;border-radius:12px;font-size:14.5px;max-width:92%;overflow-wrap:anywhere}
.msg.ai{background:var(--panel-2);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:3px}
.msg pre.code{font-size:12.5px;margin:6px 0;white-space:pre}
.msg hr{border:0;border-top:1px solid var(--line)}
.tutor-in{display:grid;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.tutor-in textarea{resize:none;width:100%}
.tutor-off{padding:12px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}

/* ================= REDISEÑO v3: ruta visual, fondos, botones y títulos ================= */
:root{--side-bg:#07150E;--side-2:#0D2219;--side-ink:#EAF3ED;--side-muted:#8FA89A;--side-line:rgba(234,243,237,.12)}
h1,h2,h3,h4{text-transform:uppercase;letter-spacing:.01em}
h3 small,h4 small{text-transform:none;letter-spacing:0}
.msg h1,.msg h2,.msg h3{text-transform:none}

/* fondo de la página: manchas de color suaves + retícula de puntos */
body{background:
  radial-gradient(900px 520px at 105% -8%, color-mix(in srgb,var(--blue) 11%,transparent), transparent 62%),
  radial-gradient(800px 520px at -8% 108%, color-mix(in srgb,var(--green) 12%,transparent), transparent 60%),
  radial-gradient(600px 400px at 60% 50%, color-mix(in srgb,var(--yel) 5%,transparent), transparent 70%),
  var(--bg);background-attachment:fixed}
main{background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:24px 24px}

/* botones con relieve: se "hunden" al presionar */
.btn{border-radius:11px;font-weight:700;box-shadow:0 3px 0 color-mix(in srgb,var(--m,var(--accent)) 55%,#000);transform:translateY(0);transition:transform .12s,box-shadow .12s,filter .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 color-mix(in srgb,var(--m,var(--accent)) 55%,#000);filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--m,var(--accent)) 55%,#000)}
.btn.ghost{box-shadow:0 3px 0 var(--line);background:var(--panel)}
.btn.ghost:hover{box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.big{font-size:16px;padding:11px 20px;border-radius:13px}
.btn.yel{--m:var(--yel);--on-m:#1A1600;background:var(--yel);border-color:var(--yel);color:#1A1600}
.btn.ghost.light{background:transparent;color:var(--hero-ink);border-color:rgba(242,247,243,.35);box-shadow:0 3px 0 rgba(242,247,243,.18)}
.card,.chal,.q,details.lesson{border-radius:16px}

/* ---------- barra lateral oscura con la ruta como línea de metro ---------- */
.side{background:linear-gradient(180deg,var(--side-bg),var(--side-2));color:var(--side-ink);border-right:0;gap:14px}
.side .brand small{color:var(--side-muted)}
.brand-mark{background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;border-radius:12px}
.xpbox{background:rgba(234,243,237,.06);border:1px solid var(--side-line);border-radius:16px}
.xpbox .lvl{color:var(--side-muted)} .xpbox .lvl b{color:var(--side-ink)}
.side .bar{background:rgba(234,243,237,.12)}
.side #lvlBar{background:linear-gradient(90deg,var(--green),var(--yel))}
.prof{display:flex;gap:12px;align-items:center}
.prof small{display:block;color:var(--side-muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
.prof b{font-family:var(--f-display);font-size:16px;text-transform:uppercase}
.avatar{width:46px;height:46px;border-radius:50%;padding:3px;background:conic-gradient(var(--green),var(--blue),var(--red),var(--yel),var(--green));animation:spin 8s linear infinite;flex:none}
.avatar span{width:100%;height:100%;border-radius:50%;background:var(--side-bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.daybox{color:var(--side-muted)}
.continue{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px;text-align:left;border:0;border-radius:14px;padding:11px 14px;background:var(--yel);color:#1A1600;box-shadow:0 4px 0 #9E8200;transition:transform .12s,box-shadow .12s}
.continue span{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.8}
.continue b{font-family:var(--f-display);text-transform:uppercase;font-size:14.5px;grid-column:1}
.continue i{grid-row:1/3;grid-column:2;font-style:normal;width:32px;height:32px;border-radius:50%;background:#1A1600;color:var(--yel);display:grid;place-items:center;font-size:12px}
.continue:hover{transform:translateY(-1px)} .continue:active{transform:translateY(3px);box-shadow:0 1px 0 #9E8200}
.nav-group{color:var(--side-muted)}
.nav .homebtn,.nav .res{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:7px 8px;border-radius:10px;font-size:14.5px}
.hb-ico{width:32px;height:32px;border-radius:9px;background:rgba(234,243,237,.1);display:grid;place-items:center;font-size:17px}
.nav .homebtn:hover,.nav .res:hover{background:rgba(234,243,237,.07);transform:translateX(3px)}
.nav .homebtn.active,.nav .res.active{background:rgba(234,243,237,.12);box-shadow:inset 3px 0 0 var(--m)}
.metro{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:1px}
.metro::before,.metro::after{content:"";position:absolute;left:25px;top:22px;width:3px;border-radius:3px}
.metro::before{bottom:22px;background:var(--side-line)}
.metro::after{height:calc((100% - 44px) * var(--fill,0));background:linear-gradient(var(--green),var(--blue),var(--red),var(--yel));transition:height .8s cubic-bezier(.2,.8,.2,1)}
.nav .stop{display:grid;grid-template-columns:36px 1fr;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:6px 8px;border-radius:12px;position:relative;z-index:1}
.nav .stop:hover{background:rgba(234,243,237,.07);transform:translateX(3px)}
.nav .stop.active{background:rgba(234,243,237,.12);box-shadow:none}
.nav .stop.active .lbl b{color:var(--m)}
.node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--m) calc(var(--p,0) * 1%),rgba(234,243,237,.16) 0);transition:transform .2s}
.node span{width:28px;height:28px;border-radius:50%;background:var(--side-bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--side-ink)}
.stop.done .node span{background:var(--m);color:var(--on-m)}
.stop.done .node span{font-size:0}.stop.done .node span::after{content:"✓";font-size:15px}
.stop.next .node{animation:pulse 1.8s infinite}
.stop:hover .node{transform:scale(1.12)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--m) 70%,transparent)}100%{box-shadow:0 0 0 13px transparent}}
.stop .lbl{min-width:0}
.stop .lbl b{display:block;font-size:14px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .lbl small{color:var(--side-muted);font-size:12px}
.stop.next .lbl small{color:var(--yel);font-weight:700}
.side .glyph{box-shadow:0 2px 0 rgba(0,0,0,.25)}
.side-foot{color:var(--side-muted)} .linkbtn{color:var(--side-muted)}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:rgba(234,243,237,.15);border-radius:8px}

/* ---------- pestañas como pasos numerados ---------- */
.tabs{gap:4px;align-items:center}
.tabs button{display:inline-flex;align-items:center;border-radius:12px;padding:6px 14px 6px 6px;text-transform:uppercase;font-size:13px;letter-spacing:.05em;box-shadow:0 2px 0 var(--line)}
.tabs .tn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--panel-2);margin-right:8px;font-size:12px;font-weight:800}
.tabs button.on{box-shadow:0 3px 0 color-mix(in srgb,var(--m) 55%,#000)}
.tabs button.on .tn{background:var(--on-m);color:var(--m)}
.tarr{color:var(--muted);font-size:20px;line-height:1}

/* ---------- mentor ---------- */
.mavatar{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;font-family:var(--f-display);font-weight:800;font-size:18px;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mentor{display:flex;gap:14px;align-items:flex-start;background:var(--hero-bg);color:var(--hero-ink);border-radius:16px;padding:16px 18px;border-left:6px solid var(--yel);animation:rise .4s}
.mentor b{color:var(--yel)} .mentor p{margin:4px 0 10px;opacity:.9}
.mentor .btn.ghost{background:transparent;color:var(--hero-ink);border-color:rgba(242,247,243,.3);box-shadow:0 3px 0 rgba(242,247,243,.15)}
.nextbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:2px dashed color-mix(in srgb,var(--m) 60%,transparent);border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--m) 6%,var(--panel));margin-top:6px}
.nextbar p{flex:1;min-width:200px}
.nextbar.big{border-style:solid;background:color-mix(in srgb,var(--m) 13%,var(--panel))}
.mwhy{background:color-mix(in srgb,var(--on-m) 12%,transparent);border-radius:12px;padding:10px 14px;max-width:78ch;font-size:15px;color:var(--on-m)}
.mwhy b{color:var(--on-m)}
.why .btn{margin-left:6px}

/* ---------- inicio: hero ---------- */
.hero2{position:relative;overflow:clip;isolation:isolate;border-radius:24px;background:var(--hero-bg);color:var(--hero-ink);padding:clamp(22px,4.5vw,46px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:center;min-height:440px}
@media (max-width:1100px){.hero2{grid-template-columns:minmax(0,1fr)}}
.hero2 canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.blobs{position:absolute;inset:0;z-index:-2;filter:blur(60px);opacity:.55}
.blobs i{position:absolute;width:42%;aspect-ratio:1;border-radius:50%;animation:float 16s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--green);left:-10%;top:-20%}
.blobs i:nth-child(2){background:var(--blue);right:-12%;top:-10%;animation-delay:-4s}
.blobs i:nth-child(3){background:var(--red);left:30%;bottom:-35%;animation-delay:-8s;width:30%}
.blobs i:nth-child(4){background:var(--yel);right:10%;bottom:-30%;animation-delay:-12s;width:26%;opacity:.7}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,10%) scale(1.15)}100%{transform:translate(-6%,4%) scale(.95)}}
.hero2 .hero-txt{display:grid;gap:16px;min-width:0}
.hero2 .eyebrow{color:var(--hero-green)}
.hero2 h1{font-size:clamp(36px,6.4vw,74px);font-weight:800;line-height:.98;letter-spacing:-.02em}
.rot{display:inline-block;overflow:hidden;vertical-align:bottom}
#rotWord{display:inline-block;color:var(--yel);transition:color .3s}
#rotWord.out{animation:wout .26s forwards} #rotWord.in{animation:win .34s cubic-bezier(.2,.8,.2,1)}
@keyframes wout{to{transform:translateY(-100%);opacity:0}} @keyframes win{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.hero2 .lead{font-size:18px;max-width:52ch;color:color-mix(in srgb,var(--hero-ink) 85%,transparent)}
.hero2 .kpis{display:flex;flex-wrap:wrap;gap:24px}
.hero2 .kpis div{display:grid}
.hero2 .kpis b{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.hero2 .kpis span{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:.1em}
.mission{background:rgba(242,247,243,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(242,247,243,.18);border-top:5px solid var(--m);border-radius:20px;padding:22px;display:grid;gap:10px;position:relative;transition:transform .25s;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mission:hover{transform:translateY(-4px) rotate(-.4deg)}
.ms-tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--yel)}
.ms-num{position:absolute;right:18px;top:8px;font-family:var(--f-display);font-weight:800;font-size:72px;line-height:1;color:var(--m);opacity:.9}
.mission h3{font-size:26px;padding-right:90px}
.mission p{font-size:15px;opacity:.85}
.ms-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14.5px}
.ms-list li{display:flex;gap:8px;align-items:center}
.ms-list li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(242,247,243,.35);font-size:11px;flex:none}
.ms-list li.ok span{background:var(--hero-green);border-color:var(--hero-green);color:#06100B}
.mission .bar{background:rgba(242,247,243,.15)} .mission .bar i{background:var(--m)}
.mission .btn{justify-self:start}

/* ---------- inicio: mapa de la ruta ---------- */
.block{display:grid;gap:16px}
.bh{display:grid;gap:4px}
.roadmap{position:relative;display:grid;gap:14px;padding-block:6px}
.roadmap::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:4px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 18px)}
.rm{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);align-items:center}
.rm.l .rm-card{grid-column:1;grid-row:1}
.rm.r .rm-card{grid-column:3;grid-row:1}
.rm-node{grid-column:2;grid-row:1;justify-self:center;width:58px;height:58px;border-radius:50%;border:0;padding:4px;background:conic-gradient(var(--m) calc(var(--p) * 1%),var(--line) 0);cursor:pointer;z-index:1;transition:transform .2s}
.rm-node span{width:100%;height:100%;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink)}
.rm.done .rm-node span{background:var(--m);color:var(--on-m)}
.rm.now .rm-node{animation:pulse 1.8s infinite;transform:scale(1.1)}
.rm-node:hover{transform:scale(1.15) rotate(-6deg)}
.rm-card{text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:7px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.rm-card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--m)}
.rm-card:hover{transform:translateY(-3px);border-color:var(--m);box-shadow:0 12px 30px color-mix(in srgb,var(--m) 25%,transparent)}
.rm.now .rm-card{border:2px solid var(--m);box-shadow:0 12px 34px color-mix(in srgb,var(--m) 28%,transparent)}
.rm-top{display:flex;justify-content:space-between;align-items:center}
.rm-st{background:var(--panel-2);color:var(--muted);font-family:var(--f-body);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.rm.now .rm-st{background:var(--m);color:var(--on-m)}
.rm.done .rm-st{background:var(--ok-bg);color:var(--ok)}
.rm-t{font-family:var(--f-display);text-transform:uppercase;font-size:17px;letter-spacing:.01em}
.rm-why{font-size:14px;color:var(--muted)}
.rm-k{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rm-card .bar i{background:var(--m)}
@media (max-width:760px){
  .roadmap::before{left:29px}
  .rm{grid-template-columns:58px minmax(0,1fr);gap:12px}
  .rm.l .rm-card,.rm.r .rm-card{grid-column:2}
  .rm-node{grid-column:1}
}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;counter-reset:h}
.how{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px;overflow:hidden;transition:transform .2s}
.how:hover{transform:translateY(-4px) rotate(-.5deg)}
.how::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--m);opacity:.14}

.term-bar i{width:10px;height:10px;border-radius:50%;background:#E3122F}.term-bar i:nth-child(2){background:#FFD21F}.term-bar i:nth-child(3){background:#11A64B}

/* ================= v4: modo galáctico + tutor en vivo ================= */
:root{--glass:var(--panel);--neb:11%;--star-show:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#03050D;--panel:#0C1226;--panel-2:#141C38;--ink:#E9EEFF;--muted:#9EAAD0;--line:#26325A;
  --code-bg:#060A18;--hero-bg:#060B1E;--side-bg:#040817;--side-2:#0A1230;
  --glass:rgba(12,18,40,.74);--neb:24%;--star-show:block;--accent:#4BE08A;--on-accent:#03120A}}
:root[data-theme="dark"]{
  --bg:#03050D;--panel:#0C1226;--panel-2:#141C38;--ink:#E9EEFF;--muted:#9EAAD0;--line:#26325A;
  --code-bg:#060A18;--hero-bg:#060B1E;--side-bg:#040817;--side-2:#0A1230;
  --glass:rgba(12,18,40,.74);--neb:24%;--star-show:block;--accent:#4BE08A;--on-accent:#03120A}
body{background:
  radial-gradient(1000px 600px at 100% -10%, color-mix(in srgb,var(--blue) var(--neb),transparent), transparent 62%),
  radial-gradient(900px 600px at -10% 110%, color-mix(in srgb,var(--green) var(--neb),transparent), transparent 60%),
  radial-gradient(700px 500px at 55% 45%, color-mix(in srgb,#7B3CFF calc(var(--neb) * .6),transparent), transparent 70%),
  radial-gradient(600px 420px at 85% 85%, color-mix(in srgb,var(--red) calc(var(--neb) * .5),transparent), transparent 70%),
  var(--bg);background-attachment:fixed}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:var(--star-show)}
.app{position:relative;z-index:1}
:root.galaxy main{background-image:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) main{background-image:none}}
.card,.chal,.q,details.lesson,.rm-card,.how,.vis,.gz,.editor-bar,.out,.modcard{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tabs{background:transparent}
.tabs button{background:var(--glass)}
.tabs button.on{background:var(--m)}
.side{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* ---------- editor con números de línea ---------- */
.ed-wrap{display:flex;background:var(--code-bg);min-width:0}
.gutter{margin:0;padding:14px 8px 14px 12px;text-align:right;color:var(--code-muted);font-family:var(--f-mono);font-size:14px;line-height:1.6;user-select:none;overflow:hidden;border-right:1px solid rgba(255,255,255,.08);min-width:42px;background:rgba(255,255,255,.02)}
.gutter b{color:#fff;background:var(--bad);border-radius:4px;padding:0 4px;font-weight:700}
.ed-wrap textarea.code{flex:1;min-width:0}

/* ---------- tutor en vivo ---------- */
.coach{border-radius:16px;padding:14px 16px;display:grid;gap:10px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:rise .35s cubic-bezier(.2,.8,.2,1);border-left:6px solid var(--ok);margin-top:10px}
.coach.err{border-left-color:var(--bad);box-shadow:0 10px 30px color-mix(in srgb,var(--bad) 18%,transparent)}
.coach.warn{border-left-color:var(--yel)}
.ch-h{display:flex;gap:12px;align-items:center}
.ch-h > div{flex:1}
.ch-tag{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.ch-h b{font-family:var(--f-display);text-transform:uppercase;font-size:16px}
.coach.err .ch-h b{color:var(--bad)} .coach.ok .ch-h b{color:var(--ok)}
.coach .mavatar{width:36px;height:36px;font-size:15px}
.ch-x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1}
.ch-sec{display:grid;gap:5px}
.ch-l{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--m-t,var(--accent))}
.coach ol,.coach ul{margin:0;padding-left:20px;display:grid;gap:3px;font-size:15px}
.ch-raw{display:block;white-space:pre-wrap;word-break:break-word;font-size:12.5px;color:var(--bad)}
.ch-okp{font-size:15px}
.ch-terms{display:flex;flex-wrap:wrap;gap:6px}
.term-chip{border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600;transition:transform .15s}
.term-chip:hover{transform:translateY(-2px)}
.term-chip.known{border-style:solid;opacity:.75}
.term-chip.known::before{content:"✓ ";color:var(--ok)}
.term-def{background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:14.5px;animation:rise .25s}
.ch-ai{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px;font-size:15px}
.ch-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ch-auto{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.msg.ev{font-size:13px;padding:6px 10px;background:transparent;border:1px solid var(--line);align-self:stretch;max-width:100%}
.msg.ev.err b{color:var(--bad)} .msg.ev.ok b{color:var(--ok)} .msg.ev.warn b{color:var(--warn)}
.tutor-fab.ping .tf-dot{background:var(--bad);animation:pulse 1s 3}
.tutor{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

/* ---------- diccionario personal ---------- */
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.dterm{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.dterm.known{border-color:var(--ok)}
.fcard{border:2px solid var(--accent);border-radius:16px;padding:18px;display:grid;gap:8px;text-align:center;justify-items:center;background:var(--panel-2)}
.fcard b{font-family:var(--f-display);font-size:26px;text-transform:uppercase}

:root.galaxy .mhead{

    radial-gradient(1.2px 1.2px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 34% 68%,#cfe0ff,transparent),

    radial-gradient(700px 320px at 88% 10%,color-mix(in srgb,var(--m) 42%,transparent),transparent 70%),
    radial-gradient(520px 280px at 0% 120%,color-mix(in srgb,var(--m) 26%,transparent),transparent 70%),

:root.galaxy .mhead .mring .bg{stroke:rgba(255,255,255,.12)}
:root.galaxy .mhead .mring .fg{stroke:var(--m);filter:drop-shadow(0 0 5px var(--m))}
:root.galaxy .mhead .mring text{fill:var(--ink)}

/* pestañas: brillo de neón en lugar de bloque sólido */
:root.galaxy .tabs button.on{background:color-mix(in srgb,var(--m) 20%,#070C22);color:#fff;border-color:var(--m);box-shadow:0 0 0 1px var(--m),0 0 18px color-mix(in srgb,var(--m) 45%,transparent)}
:root.galaxy .tabs button.on .tn{background:var(--m);color:var(--on-m)}

/* botones principales con degradado y halo */

:root.galaxy .btn.ghost:hover{background:rgba(255,255,255,.09);border-color:color-mix(in srgb,var(--m,var(--accent)) 60%,transparent)}

/* lecciones, retos y tarjetas: bordes con brillo */
:root.galaxy details.lesson[open]{box-shadow:inset 4px 0 0 var(--m),0 0 26px color-mix(in srgb,var(--m) 14%,transparent)}

:root.galaxy .mhead{

  box-shadow:0 0 0 1px color-mix(in srgb,var(--m) 40%,transparent),0 0 18px color-mix(in srgb,var(--m) 70%,transparent),0 0 60px color-mix(in srgb,var(--m) 38%,transparent),0 0 120px color-mix(in srgb,var(--m) 18%,transparent),inset 0 0 50px color-mix(in srgb,var(--m) 18%,transparent);

/* destello que recorre el borde */
:root.galaxy .mhead::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;z-index:0;pointer-events:none;
